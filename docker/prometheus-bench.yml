# 부하 테스트 전용 Prometheus 설정
#  - 앱은 compose 네트워크 안에 있으므로 서비스명으로 스크레이프한다
#  - k6 는 remote write 로 직접 밀어 넣는다 (--web.enable-remote-write-receiver)
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'commerce'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['commerce:8081']
        labels:
          service: 'commerce'

  - job_name: 'payments'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payments:8085']
        labels:
          service: 'payments'

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: 'kafka'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
