global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'payments'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8085']
        labels:
          service: 'payments'
          module: 'commerce'

  - job_name: 'commerce'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'commerce'
          module: 'commerce'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
